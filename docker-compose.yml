services:
  database:
    image: postgres:17
    container_name: assignment13-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: assignment13
      POSTGRES_USER: assignment13
      POSTGRES_PASSWORD: assignment13
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: assignment13
      DB_USER: assignment13
      DB_PASSWORD: assignment13
    depends_on:
      - database
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "90:80"

volumes:
  postgres_data: