name: Assignment 13 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Validate, Build and Publish
    runs-on: self-hosted

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run unit tests
        run: |
          cd backend
          python -m pytest

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-frontend:${{ github.run_number }} \
            ./frontend

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-backend:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-backend:${{ github.run_number }} \
            ./backend

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push frontend images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-frontend:${{ github.run_number }}

      - name: Push backend images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/assignment13-backend:${{ github.run_number }}